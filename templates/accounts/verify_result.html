{% extends "base.html" %}
{% load i18n %}
{% block title %}{{ title }}{% endblock %}

{% block content_auth %}
<div class="auth-card text-center">
  <div class="mb-4">
    {% if ok %}
      <div style="font-size:60px;color:#22c55e;"><i class="bi bi-check-circle-fill"></i></div>
    {% else %}
      <div style="font-size:60px;color:#f59e0b;"><i class="bi bi-exclamation-triangle-fill"></i></div>
    {% endif %}
  </div>
  <h3 class="fw-bold">{{ title }}</h3>
  <p class="text-muted">{{ message }}</p>

  <div class="mt-4">
    <a href="/login/" class="btn btn-primary w-100 py-2">
      <i class="bi bi-box-arrow-in-right me-1"></i> {% trans "Prisijungti" %}
    </a>
  </div>
</div>
{% endblock %}
