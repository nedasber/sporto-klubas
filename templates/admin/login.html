{% extends "admin/login.html" %}
{% load i18n static %}

{% block extrastyle %}
{{ block.super }}
<link rel="icon" type="image/svg+xml" href="{% static 'favicon.svg' %}">
<link rel="icon" type="image/png" href="{% static 'favicon.png' %}">
<link rel="apple-touch-icon" href="{% static 'favicon.png' %}">
<style>
body.login {
  background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%) !important;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
}
.login #container {
  background: #fff !important;
  border-radius: 16px !important;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3) !important;
  padding: 40px 36px !important;
  max-width: 420px !important;
  width: 90% !important;
  border: none !important;
}
.login #header {
  background: transparent !important;
  text-align: center !important;
  padding: 0 0 24px 0 !important;
  border-bottom: 1px solid #e2e8f0 !important;
  margin-bottom: 24px !important;
}
.login #header #site-name {
  font-size: 22px !important;
  color: #1e293b !important;
  font-weight: 700 !important;
}
.login #branding h1 {
  color: #1e293b !important;
  font-weight: 700;
  font-size: 22px;
  margin: 0;
}
.login #content {
  padding: 0 !important;
}
.login form {
  margin: 0 !important;
}
.login .form-row {
  padding: 8px 0 !important;
  border: none !important;
}
.login .form-row label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: #475569;
  margin-bottom: 6px;
}
.login input[type=text], .login input[type=password] {
  width: 100% !important;
  padding: 12px 14px !important;
  font-size: 14px !important;
  border-radius: 10px !important;
  border: 1px solid #e2e8f0 !important;
}
.login input[type=text]:focus, .login input[type=password]:focus {
  border-color: #4361ee !important;
  box-shadow: 0 0 0 3px rgba(67,97,238,.15) !important;
  outline: none !important;
}
.login .submit-row {
  padding: 16px 0 0 0 !important;
  text-align: center !important;
  border: none !important;
}
.login .submit-row input {
  width: 100% !important;
  padding: 12px !important;
  background: #4361ee !important;
  border: none !important;
  border-radius: 10px !important;
  color: #fff !important;
  font-size: 15px !important;
  font-weight: 600 !important;
  cursor: pointer;
  transition: all .15s;
}
.login .submit-row input:hover {
  background: #3a56d4 !important;
  box-shadow: 0 4px 16px rgba(67,97,238,.3) !important;
}
.errornote {
  background: #fee2e2 !important;
  color: #991b1b !important;
  border: 1px solid #dc2626 !important;
  border-radius: 8px !important;
  padding: 10px 14px !important;
  font-size: 13px !important;
}
</style>
{% endblock %}

{% block branding %}
<div style="text-align:center;">
  <div style="font-size:48px;margin-bottom:8px;">💪</div>
  <h1 id="site-name">Sporto klubas</h1>
  <p style="color:#64748b;font-size:14px;margin-top:4px;">Administracijos prisijungimas</p>
</div>
{% endblock %}
